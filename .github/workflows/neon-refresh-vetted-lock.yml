name: Refresh vetted Neon preview Blob lockfile (temporary)
on:
  push:
    branches: [feature/neon-application-cutover-preflight]
    paths: [.github/workflows/neon-refresh-vetted-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(neon): lock compatible Blob SDK 2.3.3"
            git push origin HEAD:refs/heads/feature/neon-application-cutover-preflight
          fi
