name: Copy isolated London Neon staging database to Frankfurt (one-off)
on:
  push:
    branches: [feature/neon-application-cutover-preflight]
    paths: [".github/workflows/neon-frankfurt-copy.yml"]
permissions:
  contents: read
jobs:
  copy-database:
    runs-on: ubuntu-latest
    container: postgres:18
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull branch-only encrypted connections from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_RnUFntCuGa3xIhVCUU7Jey8X
          VERCEL_PROJECT_ID: prj_gakC4aJHh0P8f3exGw7xsygjxlaC
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing VERCEL_TOKEN"; exit 1; }
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest env pull .env.neon-migration --environment=preview --git-branch=feature/neon-application-cutover-preflight --yes --token="$VERCEL_TOKEN"
          chmod 600 .env.neon-migration
      - name: Guard source and destination; copy within an atomic database transaction; verify every table
        run: node scripts/neon-frankfurt-migrate.cjs
