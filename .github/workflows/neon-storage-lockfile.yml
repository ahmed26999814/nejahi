name: Refresh lockfile for Neon Object Storage (temporary)
on:
  push:
    branches: [feature/neon-application-cutover-preflight]
    paths: [".github/workflows/neon-storage-lockfile.yml"]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(neon): lock AWS S3 SDK instead of Vercel Blob"
            git push origin HEAD:refs/heads/feature/neon-application-cutover-preflight
          fi
