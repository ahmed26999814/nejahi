name: Mirror public Supabase assets for Neon preview (one-off)
on:
  push:
    branches:
      - feature/neon-application-cutover-preflight
    paths:
      - .github/workflows/neon-assets-mirror.yml
      - docs/neon-public-assets-manifest.json
permissions:
  contents: write
jobs:
  mirror-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror 25 public-only storage objects and verify their sizes
        run: node scripts/neon-mirror-public-assets.mjs
      - name: Commit public assets to this isolated preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/neon-migrated-storage/
          if ! git diff --cached --quiet; then
            git commit -m "assets(neon): archive public release and site images for independent hosting"
            git push origin HEAD:refs/heads/feature/neon-application-cutover-preflight
          fi
