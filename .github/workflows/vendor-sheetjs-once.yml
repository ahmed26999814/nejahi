name: Vendor verified SheetJS for MauriResults
on:
  push:
    branches:
      - improve/mauriresults-ux-security-20261029
    paths:
      - .github/workflows/vendor-sheetjs-once.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --show-error --location --retry 5 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz' -o vendor/xlsx-0.20.3.tgz
          echo '8dc73fc3b00203e72d176e85b50938627c7b086e607c682e8d3c22c02bb99fe8  vendor/xlsx-0.20.3.tgz' | sha256sum --check
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.dependencies.xlsx !== 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz') throw Error('Unexpected SheetJS dependency; refusing change');
          p.dependencies.xlsx = 'file:vendor/xlsx-0.20.3.tgz';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          sed -i 's@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz@file:vendor/xlsx-0.20.3.tgz@g' tests/excel-reader.test.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked installation and test
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit verified vendor archive to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/xlsx-0.20.3.tgz package.json package-lock.json tests/excel-reader.test.mjs
          git commit -m 'fix(deploy): vendor verified official SheetJS 0.20.3 archive'
          git push origin HEAD:improve/mauriresults-ux-security-20261029
